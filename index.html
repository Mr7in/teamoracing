<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team-O Racing</title>
<meta name="description" content="Team-O Racing on Eesti karditiim, asutatud 2023. 12 sõitjat viies klassis: Mini, Cadet, OK, KZ2 ja DD2 Masters.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://teamoracing.noclip.ee/">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Team-O Racing">
<meta property="og:title" content="Team-O Racing | Rohkem kui meeskond. Perekond.">
<meta property="og:description" content="Eesti karditiim, asutatud 2023. 12 sõitjat, 5 klassi, üks ühine armastus võidusõidu vastu.">
<meta property="og:url" content="https://teamoracing.noclip.ee/">
<meta property="og:image" content="https://teamoracing.noclip.ee/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Team-O Racing kardid rajal">
<meta property="og:locale" content="et_EE">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:locale:alternate" content="it_IT">
<meta property="og:locale:alternate" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Team-O Racing">
<meta name="twitter:description" content="Eesti karditiim, asutatud 2023.">
<meta name="twitter:image" content="https://teamoracing.noclip.ee/assets/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Team-O Racing"><img src="assets/logo.png" alt="Team-O Racing" width="117" height="44"></a>
    <nav class="nav" aria-label="Menu">
      <a href="#soitjad" data-i18n="nav.riders"></a>
      <a href="#kalender" data-i18n="nav.calendar"></a>
      <a href="#instagram">Instagram</a>
      <a href="#meist" data-i18n="nav.about"></a>
      <a class="btn btn-red" href="#sponsorlus" data-i18n="nav.partner"></a>
    </nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="et" lang="et">ET</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="it" lang="it">IT</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
      <button class="burger" type="button" aria-expanded="false" aria-controls="mnav" data-i18n-aria="nav.open">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
  </div>
  <nav class="mnav" id="mnav" aria-label="Mobile menu">
    <div class="wrap">
      <a href="#soitjad" data-i18n="nav.riders"></a>
      <a href="#kalender" data-i18n="nav.calendar"></a>
      <a href="#instagram">Instagram</a>
      <a href="#meist" data-i18n="nav.about"></a>
      <a href="#sponsorlus" data-i18n="nav.sponsorship"></a>
    </div>
  </nav>
</header>

<main>
<section class="hero" id="top">
  <div class="wrap grid2">
    <div class="hero-copy">
      <div class="kicker" data-i18n="hero.kicker"></div>
      <h1 class="h1" data-i18n-html="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="ctas">
        <a class="btn btn-red" href="#soitjad" data-i18n="hero.ctaRiders"></a>
        <a class="btn btn-ghost" href="#kalender" data-i18n="hero.ctaCal"></a>
      </div>
      <div class="next" id="next"></div>
    </div>
    <div class="hero-img">
      <img src="assets/ig1.jpg" data-i18n-alt="alt.hero" width="768" height="768">
      <div class="tag">#teamoracing</div>
    </div>
  </div>
</section>

<section class="stats-band" aria-label="Stats">
  <div class="wrap stats">
    <div class="stat"><b class="r">12</b><span data-i18n="stats.riders"></span></div>
    <div class="stat"><b>5</b><span data-i18n="stats.classes"></span></div>
    <div class="stat"><b>2023</b><span data-i18n="stats.founded"></span></div>
    <div class="stat"><b>[X]</b><span data-i18n="stats.podiums"></span></div>
  </div>
</section>

<section class="section" id="soitjad">
  <div class="wrap stack">
    <div class="head">
      <span class="eyebrow" data-i18n="riders.eyebrow"></span>
      <h2 class="h2" data-i18n="riders.title"></h2>
      <p class="sub" data-i18n="riders.sub"></p>
    </div>
    <div class="chips" id="classChips" role="group"></div>
    <div class="riders" id="riders"></div>
  </div>
</section>

<section class="section light" id="kalender">
  <div class="wrap stack">
    <div class="head-row">
      <div class="head">
        <span class="eyebrow" data-i18n="cal.eyebrow"></span>
        <h2 class="h2" data-i18n="cal.title"></h2>
        <p class="sub" data-i18n="cal.sub"></p>
      </div>
      <a class="btn btn-black" id="subscribe" href="#kalender">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>
        <span data-i18n="cal.add"></span>
      </a>
    </div>
    <div class="chips" id="calTabs" role="group"></div>
    <div class="events" id="events"></div>
  </div>
</section>

<section class="section" id="instagram">
  <div class="wrap stack">
    <div class="head-row">
      <div class="head">
        <span class="eyebrow" data-i18n="ig.eyebrow"></span>
        <h2 class="h2">@teamoracingofficial</h2>
      </div>
      <a class="btn btn-red" href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        <span data-i18n="ig.follow"></span>
      </a>
    </div>
    <div class="igrid">
      <a href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener"><img src="assets/ig1.jpg" alt="Team-O Racing" loading="lazy"></a>
      <a href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener"><img src="assets/ig2.jpg" alt="Team-O Racing" loading="lazy"></a>
      <a href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener"><img src="assets/ig3.jpg" alt="Team-O Racing" loading="lazy"></a>
      <a href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener"><img src="assets/ig4.jpg" alt="Team-O Racing" loading="lazy"></a>
    </div>
    <p class="sub" data-i18n="ig.note"></p>
  </div>
</section>

<section class="section about" id="meist">
  <div class="wrap grid2">
    <img src="assets/r-vendla.jpg" alt="Mario Vendla" loading="lazy">
    <div class="stack" style="gap:16px">
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h2 class="h2" data-i18n="about.title"></h2>
      <p data-i18n="about.text"></p>
    </div>
  </div>
</section>

<section class="section spon" id="sponsorlus">
  <div class="wrap stack" style="gap:28px">
    <div class="head" style="max-width:720px">
      <span class="eyebrow" data-i18n="sp.eyebrow"></span>
      <h2 class="h2" data-i18n="sp.title"></h2>
      <p class="sub" data-i18n="sp.sub"></p>
    </div>
    <div class="tiers" id="tiers"></div>
    <div class="stack" style="gap:12px">
      <span class="eyebrow" style="color:#fff" data-i18n="sp.partners"></span>
      <div class="logos">
        <div><img src="assets/sp-est1.png" alt="EST1 Racing"></div>
        <div><img src="assets/sp-cl.png" alt="Partner"></div>
        <div><img src="assets/sp-vitamineral.png" alt="Vitamineral Water"></div>
      </div>
    </div>
    <div class="ctas">
      <a class="btn btn-black" id="mailSp" href="mailto:timo@team-o.racing" data-i18n="sp.ask"></a>
      <a class="btn btn-white" href="tel:+3725101505" data-i18n="sp.call"></a>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <img src="assets/logo.png" alt="Team-O Racing" loading="lazy">
      <div class="contact">
        <span class="lbl" data-i18n="foot.contact"></span>
        <a href="mailto:timo@team-o.racing">timo@team-o.racing</a>
        <a href="tel:+3725101505">+372 510 1505</a>
        <a class="r" href="https://www.instagram.com/teamoracingofficial/" target="_blank" rel="noopener">@teamoracingofficial</a>
      </div>
    </div>
    <div class="legal">
      <span data-i18n="foot.rights"></span>
      <span data-i18n="foot.concept"></span>
    </div>
  </div>
</footer>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pName">
    <div class="top-img">
      <img id="pImg" src="" alt="">
      <button class="x" type="button" id="pClose" data-i18n-aria="profile.close">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <span class="badge" id="pCls"></span>
    </div>
    <div class="body">
      <h3 class="h3" id="pName" style="font-size:30px"></h3>
      <div class="facts">
        <div><span data-i18n="profile.number"></span><b>[#]</b></div>
        <div><span data-i18n="profile.class"></span><b id="pCls2"></b></div>
        <div><span data-i18n="profile.kart"></span><b data-i18n="profile.kartVal"></b></div>
        <div><span data-i18n="profile.since"></span><b data-i18n="profile.sinceVal"></b></div>
      </div>
      <div>
        <span class="eyebrow" data-i18n="profile.results"></span>
        <div class="res"><span data-i18n="profile.round1"></span><b data-i18n="profile.place"></b></div>
        <div class="res"><span data-i18n="profile.round2"></span><b data-i18n="profile.place"></b></div>
      </div>
      <p data-i18n="profile.bio"></p>
      <a class="btn btn-red" id="pIg" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
